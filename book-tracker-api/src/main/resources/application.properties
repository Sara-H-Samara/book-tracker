spring.application.name=book-tracker-api
# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/booktracker
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.data.web.pageable.max-page-size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# ===== Errors =====
server.error.include-stacktrace=never
server.error.include-message=never
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
# CORS: which frontends may call this API (comma-separated)
app.cors.allowed-origins=http://localhost:4200
# First admin (created at startup if it doesn't exist). Values come from env variables.
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}